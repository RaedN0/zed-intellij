[package]
name = "zed_intellij"
version = "0.3.0"
edition = "2021"
publish = false
license = "MIT"

[lib]
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
zed_extension_api = "0.6.0"
# EULA acceptance hash is computed from the installed distribution's EULA.txt
# (see IntelliJServer::eula_hash) instead of being pinned in a constant.
sha2 = "0.10"
