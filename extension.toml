id = "intellij-server"
name = "IntelliJ Server (Java and Kotlin)"
description = "JetBrains' standalone IntelliJ language server for Java and Kotlin ('Java and Kotlin by IntelliJ IDEA')."
version = "0.1.0"
schema_version = 1
authors = ["mschoerghuber"]

# Provides one language server, `intellij-server`, for both Kotlin and Java.
# Grammars themselves come from the official `kotlin`/`java` extensions; only
# install this alongside them.
#
# NOTE (EAP): the upstream server is EAP-quality, builds expire ~30 days after
# release, and JetBrains will require an IDEA Ultimate license after 1.0.
[language_servers.intellij-server]
name = "IntelliJ Server"
languages = ["Kotlin", "Java"]

# The IntelliJ debug engine intellij-server embeds behind its
# start_debug_server LSP command. Zed side, this adapter is just a bridge
# process (bin/intellij-dap-bridge) pumping DAP between Zed and the TCP
# endpoint the proxy asks the server to open. Debug configs in
# .zed/debug.json use adapter = "intellij_jvm" — the id the server's own
# debugger lookup expects (the same string VS Code uses as the debug type).
# Seeded binaries (wiped by dev reinstall, re-copy afterwards!):
#   bin/intellij-lsp-proxy      (built from proxy/ in this repo)
#   bin/intellij-dap-bridge     (built from bridge/ in this repo)
[debug_adapters.intellij_jvm]
languages = ["Kotlin", "Java"]
