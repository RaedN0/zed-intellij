# Builds the native binary (intellij-native from native/, which serves both the
# LSP proxy and the DAP adapter mode) for every supported target and attaches
# one flat tar.gz per platform to the GitHub release matching the pushed tag.
#
# The extension pins exactly this tag — `v<CARGO_PKG_VERSION>` from Cargo.toml
# (src/language_servers/util.rs) — so bump the version and push a matching tag
# whenever the binary changes. Asset naming contract:
#   zed-intellij-v<version>-<target-triple>.tar.gz
# containing the single executable intellij-native at the archive root.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # The extension resolves its binaries under `v<CARGO_PKG_VERSION>
  # (src/language_servers/util.rs, baked in at compile time) while the steps
  # below name assets after the pushed tag. If the two disagree the release is
  # broken in a way no build failure announces:
  #   tag above the version -> installs look for a release that does not exist
  #   tag below the version -> installs silently resolve the PREVIOUS release
  # Refusing the release is much cheaper than either.
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches the manifest versions
        run: |
          cargo_version="$(python3 -c 'import tomllib;print(tomllib.load(open("Cargo.toml","rb"))["package"]["version"])')"
          ext_version="$(python3 -c 'import tomllib;print(tomllib.load(open("extension.toml","rb"))["version"])')"
          echo "tag=${GITHUB_REF_NAME}  Cargo.toml=${cargo_version}  extension.toml=${ext_version}"
          if [ "v${cargo_version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${cargo_version}. The extension resolves v<CARGO_PKG_VERSION>, so this release would be unreachable."
            exit 1
          fi
          if [ "${ext_version}" != "${cargo_version}" ]; then
            echo "::error::extension.toml says ${ext_version} but Cargo.toml says ${cargo_version}. The registry would advertise a version whose binaries do not exist."
            exit 1
          fi

  build:
    needs: guard
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    env:
      # Pure-Rust crates — cross-compiling aarch64 Linux only needs a linker.
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install aarch64 Linux cross linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build native
        working-directory: native
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        run: |
          target="${{ matrix.target }}"
          staging="$(mktemp -d)"
          cp "native/target/${target}/release/intellij-native" "$staging/"
          chmod +x "$staging"/*
          # Flat archive: the extension extracts it directly into bin/<version>/
          tar -czf "zed-intellij-${GITHUB_REF_NAME}-${target}.tar.gz" \
            -C "$staging" intellij-native

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: zed-intellij-*.tar.gz
